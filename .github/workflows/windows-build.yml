name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os; from praktika import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__, 'Tag and application version differ'"
      - name: Build and test
        shell: cmd
        run: build.bat
      - run: python scripts/check_packaged.py
      - uses: actions/upload-artifact@v4
        with:
          name: Praktika-windows-x64
          path: release/Praktika-windows-x64.zip
